# Configuration du bot MPP.
#
# Tout est deja regle pour fonctionner sans intervention. Les seules choses a
# fournir sont les deux secrets GitHub MPP_EMAIL et MPP_PASSWORD.
#
# Il n'y a AUCUN selecteur CSS a renseigner : une carte de match est reconnue a
# sa signature numerique (3 cotes + 3 pourcentages + une heure), pas a ses
# classes. Voir mpp/detect.py.

state_dir: state

# Ne pronostiquer que ces competitions (recherche dans le libelle de
# competition et de journee). Vide = toutes les cartes trouvees.
# A renseigner si MPP affiche C1 et C3 sur la meme page : sans filtre, le bot
# pronostiquerait l'Europa League en croyant faire la Ligue des Champions.
competition_filter: []

# Garde-fou : au-dela, on suspecte une erreur de page (tout un championnat au
# lieu de la journee du jour).
max_matches_per_run: 40

strategy:
  # Nombre de matchs par journee sur lesquels on accepte de s'ecarter du favori
  # du marche. C'EST LE SEUL REGLAGE QUI COMPTE.
  #
  # Sur MPP, cote = K / probabilite, donc l'esperance de points est identique
  # pour les trois issues (verifie dans tests/test_odds.py). Suivre le favori
  # ne rapporte donc rien : on finit median. S'ecarter de la foule est en
  # revanche GRATUIT en esperance, et ne coute que de la variance.
  #
  # Sur une journee de 18 matchs :
  #   0     suivre le marche, finir median (garanti)
  #   2-3   prudent, uniquement les deviations quasi gratuites
  #   5     agressif mais tenable  <- defaut
  #   8+    dernier la plupart des semaines, premier de temps en temps
  target_deviations: 5

  # Utilise seulement si target_deviations est mis a null.
  kappa: 0.35
  kappa_max: 3.0

  # S'ajoute a kappa pour monter la variance quand on court apres le leader.
  catchup_kappa: 0.0

  # Modele de buts (choix du score une fois l'issue decidee).
  rho: 0.0             # correction Dixon-Coles ; 0 = Poisson pur, a calibrer
  total_prior: 3.05    # buts par match en phase de ligue de C1
  total_shrink: 0.75   # corrige le biais bas de l'ajustement sur les seules
                       # cotes (2.5 buts au lieu de 3.1). Le score bascule de
                       # 1-0 vers 2-1 entre 0.7 et 0.8 : en dessous de 0.7 le
                       # reglage est inerte. Voir README.

  # Bonus MPP pour un score exact. Inconnu a ce jour : n'influence pas le choix
  # de l'issue, seulement l'esperance affichee dans les rapports.
  exact_bonus: 0.0

windows:
  early_min: 360       # passe J-1 : matchs entre T-48h et T-6h
  early_max: 2880
  late_min: 15         # passe tardive : matchs entre T-90min et T-15min
  late_max: 90
  deadline_margin: 6   # jamais de soumission a moins de 6 min du coup d'envoi

site:
  base_url: "https://www.monpetitprono.com"

  # Laisser vide : le bot part de base_url, ferme la banniere cookies, trouve
  # le formulaire de connexion, puis trouve la page de pronostics en suivant
  # les liens. Ne renseigner que si le diagnostic montre qu'il s'est perdu.
  login_url: ""
  matches_url: ""

  headless: true
  timeout_ms: 25000
  action_delay_s: [1.2, 2.8]   # temporisation aleatoire entre deux actions
  nav_attempts: 6
  locale: fr-FR
  executable_path: ""          # usage local uniquement, jamais en CI
